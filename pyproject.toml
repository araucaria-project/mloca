[project]
name = "mloca"
version = "0.1.3"
description = ""
authors = [
    {name = "MMiirrkk",email = "cot@wp.pl"}
]
license = {text = "Apache 2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy (>=2.4.4,<3.0.0) ; python_version >= '3.11'",
    "numpy (>=1.26,<2.0) ; python_version >= '3.10' and python_version < '3.11'",
    "scikit-learn (>=1.8.0,<2.0.0)"
]

[tool.poetry]
packages = [
    {include = "mloca"}
]
include = [
    {path = "mloca/focus_model/models/*.pkl", format = ["sdist", "wheel"]}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
